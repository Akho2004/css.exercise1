
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase</title>

    <style>
        /* General styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        /* Header section */
        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 8px;
        }

        header h1 {
            font-size: 30px;
        }

        /* Main product section */
        main {
            display: grid;
            grid-template-columns: repeat(3, 300px);
            justify-content: center;
            gap: 25px;
        }

        /* Product cards */
        .product-card {
            width: 300px;
            padding: 15px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* Product images */
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
        }

        /* Product names */
        .product-card h2 {
            margin: 15px 0;
            font-size: 21px;
            color: #333;
        }

        /* Product prices */
        .price {
            color: #4CAF50;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Add to Cart button */
        .product-card button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .product-card button:hover {
            background-color: #388E3C;
        }

        /* Tablet screen: 2 cards per row */
        @media screen and (max-width: 768px) {
            main {
                grid-template-columns: repeat(2, 300px);
            }
        }

        /* Mobile screen: 1 card per row */
        @media screen and (max-width: 480px) {
            body {
                padding: 10px;
            }

            main {
                grid-template-columns: 1fr;
            }

            .product-card {
                width: 100%;
            }
        }

    </style>
</head>

<body>

    <!-- Header section -->
    <header>
        <h1>My Product Showcase</h1>
        <p>Discover our amazing products!</p>
    </header>

    <!-- Main section with 6 product cards -->
    <main>

        <!-- Product 1 -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600"
                 alt="Red running shoes">
            <h2>Running Shoes</h2>
            <p class="price">R899.99</p>
            <button>Add to Cart</button>
        </div>

        <!-- Product 2 -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600"
                 alt="Wrist watch">
            <h2>Classic Watch</h2>
            <p class="price">R599.99</p>
            <button>Add to Cart</button>
        </div>

        <!-- Product 3 -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600"
                 alt="Headphones">
            <h2>Headphones</h2>
            <p class="price">R499.99</p>
            <button>Add to Cart</button>
        </div>

        <!-- Product 4 -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=600"
                 alt="Fashion handbag">
            <h2>Fashion Bag</h2>
            <p class="price">R750.00</p>
            <button>Add to Cart</button>
        </div>

        <!-- Product 5 -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=600"
                 alt="Digital camera">
            <h2>Digital Camera</h2>
            <p class="price">R2,499.99</p>
            <button>Add to Cart</button>
        </div>

        <!-- Product 6 -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1541643600914-78b084683601?w=600"
                 alt="Perfume bottle">
            <h2>Luxury Perfume</h2>
            <p class="price">R399.99</p>
            <button>Add to Cart</button>
        </div>

    </main>

</body>
</html>
